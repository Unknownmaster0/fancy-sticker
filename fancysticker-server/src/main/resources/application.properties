spring.application.name=fancysticker-server
#debug=true
server.port=8080

#JWT Configuration - reads from JWT_SECRET_KEY environment variable
jwtSecretKey=${JWT_SECRET_KEY:fancyStickerSecretKeyForJWT!@#$%}

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.h2.console.enabled=true
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:fancystickerdb}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#don't turn it on during production environment
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

#actuator related configuration
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/fancysticker/actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.exclude=beans,health

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend application for the fancysticker e-commerce application
info.app.version=1.0.0
info.app.contact.email=fancysticker@gmail.com

stripe.apikey=${STRIPE_API_KEY:your-stripe-test-key}